<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Auction</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 460px; margin: 40px auto; padding: 0 16px; background: #f5f5f4; color: #1c1917; }
  .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .price { font-size: 48px; font-weight: 700; margin: 4px 0; }
  .timer { font-size: 28px; font-variant-numeric: tabular-nums; }
  .timer.hot { color: #dc2626; }
  .meta { color: #78716c; font-size: 14px; margin-bottom: 16px; }
  button { width: 100%; padding: 14px; font-size: 18px; border: 0; border-radius: 10px; background: #1d4ed8; color: #fff; cursor: pointer; }
  button:disabled { background: #a8a29e; cursor: not-allowed; }
  input { width: 80px; padding: 6px; font-size: 16px; }
  #status { margin-top: 14px; min-height: 22px; font-size: 14px; }
  #conn { font-size: 12px; color: #78716c; }
</style>
</head>
<body>
<div class="card">
  <h1>Limited-stock item: Flash Auction</h1>
  <div class="meta">Current highest bid</div>
  <div class="price" id="price">-</div>
  <div class="meta">Leader: <b id="winner">-</b> &middot; Bidders online: <span id="bidders">0</span></div>
  <div class="timer" id="timer">--:--</div>
  <p>
    Bid increment: +<input id="step" type="number" value="10" min="1">
  </p>
  <button id="bidBtn" disabled>Place bid</button>
  <div id="status"></div>
  <div id="conn">connecting...</div>
</div>

<script>
const userId = 'u' + Math.random().toString(36).slice(2, 8);
const $ = (id) => document.getElementById(id);
let price = 0, endsAt = 0, closed = false, offset = 0; // offset = serverTime - clientTime

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

ws.onopen = () => { $('conn').textContent = 'connected as ' + userId; $('bidBtn').disabled = false; };
ws.onclose = () => { $('conn').textContent = 'disconnected'; $('bidBtn').disabled = true; };

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'state') {
    price = m.price; endsAt = m.endsAt; closed = m.closed;
    offset = m.now - Date.now();               // sync our clock to the server's
    $('price').textContent = price;
    $('winner').textContent = m.winner || '-';
    $('bidders').textContent = m.bidders;
    if (closed) $('status').textContent = 'Auction closed. Winner: ' + (m.winner || 'nobody');
  } else if (m.type === 'result') {
    $('status').textContent = m.accepted
      ? 'Your bid was accepted: you lead at ' + m.price
      : 'Rejected (' + m.reason + '). Current price: ' + m.price;
  }
};

$('bidBtn').onclick = () => {
  const amount = price + Number($('step').value || 1);
  const bidId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
  ws.send(JSON.stringify({ type: 'bid', bidId, userId, amount }));
  $('status').textContent = 'Sending bid of ' + amount + '...';
};

setInterval(() => {                             // countdown runs locally, between server updates
  const left = Math.max(0, endsAt - (Date.now() + offset));
  const s = Math.ceil(left / 1000);
  $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  $('timer').classList.toggle('hot', left > 0 && left < 10000);
  if (left === 0 && endsAt) $('bidBtn').disabled = true;
}, 100);
</script>
</body>
</html>
